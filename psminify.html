<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="description" content="Minify PowerShell and generate a one-line batch command.">
	<meta name="keywords" content="PowerShell, minify, batch, command, script">
	<meta name="author" content="Mitch Feigenbaum">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PowerShell Minifier</title>
	<link rel="stylesheet" type="text/css" href="/css/hacker.css" media="all">
	<script src="/script/copy.js"></script>
	<script src="/script/psminify.js" defer></script>
</head>
<body>
	<div id="nav">
		<a href="/index.html">Home</a>
		<a href="/resume.html">Resume</a>
		<a href="/repos.html">Projects</a>
		<a href="/toys.html">WebToys</a>
		<a href="/rebalance.html">Rebalance</a>
		<a href="/psminify.html">PS Minify</a>
	</div>
	<div id="container">
		<h1>PowerShell Minifier</h1>
		<div class="block" id="psTool">
			<div class="ps-layout">
				<div class="ps-pane">
					<h3>Input Script</h3>
					<div class="codebox-wrap textbox-center">
						<ol id="psInputLines" class="line-numbers" aria-hidden="true"></ol>
						<textarea id="psInput" class="textbox-center codebox" rows="16" placeholder="Paste PowerShell script here..." spellcheck="false" wrap="soft" oninput="handlePsInput()" onscroll="syncInputScroll()"></textarea>
					</div>
					<div class="ps-switch-row">
						<label for="asBatchCommand">Output Batch Command</label>
						<input type="checkbox" id="asBatchCommand" checked onchange="handleToggleChange()">
					</div>
				</div>
				<div class="ps-pane">
					<h3 id="outputHeading">Batch Command</h3>
					<div class="codebox-wrap textbox-center">
						<ol id="batchOutputLines" class="line-numbers" aria-hidden="true"></ol>
						<textarea id="batchOutput" class="textbox-center codebox" rows="16" readonly spellcheck="false" wrap="off" onscroll="syncOutputScroll()"></textarea>
					</div>
					<button style="margin: 10px auto;" onclick="copy('batchOutput')">COPY</button>
				</div>
			</div>
		</div>
	</div>
	<footer>
		&copy;
		<a href="mailto:mitch@mitchf.me">Mitch Feigenbaum</a>
	</footer>
</body>
</html>
